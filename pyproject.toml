[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentsql"
version = "1.0.0b1"
description = "Natural-language questions to grounded, parameterized, read-only SQLite queries; a decision model (TypeSafe Jev or Liquid AI d1) answers bounded choices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=8", "sqlglot>=25", "ruff>=0.5", "mypy>=1.10", "gdown>=5"]

[project.scripts]
intent-sql = "intentsql.cli:main"

[tool.setuptools.packages.find]
include = ["intentsql*"]

[tool.setuptools.package-data]
intentsql = ["static/*", "data/*.db", "data/NOTICE.md"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# FastAPI's TestClient still uses httpx through Starlette; the warning is about that shim, not our code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
