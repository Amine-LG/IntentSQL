[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentsql"
version = "1.0.0"
description = "Natural language to grounded, parameterized SQLite queries, using Jev for bounded decisions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "sqlglot>=25", "ruff>=0.5", "mypy>=1.10", "gdown>=5"]

[project.scripts]
intent-sql = "intentsql.cli:main"

[tool.setuptools.packages.find]
include = ["intentsql*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
