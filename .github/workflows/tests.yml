name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      INTENTSQL_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m ruff check intentsql tests scripts experiments
      - run: python -m mypy intentsql
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check intentsql/static/app.js
